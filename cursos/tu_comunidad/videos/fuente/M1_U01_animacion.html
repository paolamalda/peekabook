<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Tu apoyo es tuyo, completo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0A3161}svg{display:block;width:1280px;height:720px}</style></head>
<body>
<!-- Video sin palabras · Tu Comunidad M1 U01. render(t) dibuja el cuadro del segundo t (0 a 45). -->
<svg id="v" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C = {navy:"#0A3161", navy2:"#061F40", mag:"#E4007C", pink:"#FF4FA8", sky:"#EAF0F8", ground:"#D6DFEC", hill:"#C5D2E6",
  skin:"#9A6440", skin2:"#B07850", hair:"#22180F", gold:"#F2B705", gold2:"#B98400", white:"#FFFFFF", gray:"#7D8AA3"};
const DUR = 45;
const cl = x => Math.max(0, Math.min(1, x));
const ease = x => (1 - Math.cos(Math.PI * cl(x))) / 2;
const p = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const pop = (t, a) => { const k = cl((t - a) / 0.5); return k < 1 ? 1.15 * Math.sin(k * Math.PI / 2) + (k > .8 ? (k - .8) * -0.75 : 0) : 1; };

function coin(x, y, r = 22, o = 1) {
  return `<g opacity="${o}"><circle cx="${x}" cy="${y}" r="${r}" fill="${C.gold}" stroke="${C.gold2}" stroke-width="${r * .14}"/>
  <circle cx="${x}" cy="${y}" r="${r * .62}" fill="none" stroke="${C.gold2}" stroke-width="${r * .08}"/>
  <text x="${x}" y="${y + r * .32}" font-size="${r * .9}" text-anchor="middle" font-family="Arial Black,Arial" fill="${C.gold2}">$</text></g>`;
}
function woman(x, y, s, o = {}) {
  const sk = o.skin || C.skin, rb = o.rebozo || C.navy, bl = o.blouse || "#F7F2EA", sk2 = o.skirt || "#5B6E9C";
  const mouth = o.sad ? `<path d="M${x - 9 * s} ${y - 176 * s} q ${9 * s} ${-8 * s} ${18 * s} 0" stroke="${C.navy2}" stroke-width="${3 * s}" fill="none" stroke-linecap="round"/>`
                      : `<path d="M${x - 9 * s} ${y - 181 * s} q ${9 * s} ${10 * s} ${18 * s} 0" stroke="${C.navy2}" stroke-width="${3 * s}" fill="none" stroke-linecap="round"/>`;
  const bag = o.bag ? `<rect x="${x + 30 * s}" y="${y - 105 * s}" width="${34 * s}" height="${30 * s}" rx="${6 * s}" fill="${C.mag}"/><path d="M${x + 36 * s} ${y - 105 * s} q ${11 * s} ${-18 * s} ${22 * s} 0" stroke="${C.mag}" stroke-width="${3 * s}" fill="none"/>` : "";
  return `<g>
  <path d="M${x - 40 * s} ${y} L${x + 40 * s} ${y} L${x + 27 * s} ${y - 96 * s} L${x - 27 * s} ${y - 96 * s} Z" fill="${sk2}"/>
  <rect x="${x - 27 * s}" y="${y - 160 * s}" width="${54 * s}" height="${70 * s}" rx="${14 * s}" fill="${bl}"/>
  <path d="M${x - 36 * s} ${y - 150 * s} Q${x} ${y - 176 * s} ${x + 36 * s} ${y - 150 * s} L${x + 32 * s} ${y - 100 * s} L${x - 32 * s} ${y - 100 * s} Z" fill="${rb}"/>
  <path d="M${x - 33 * s} ${y - 128 * s} L${x + 33 * s} ${y - 128 * s} M${x - 32 * s} ${y - 114 * s} L${x + 32 * s} ${y - 114 * s}" stroke="${C.pink}" stroke-width="${3 * s}" opacity=".8"/>
  ${bag}
  <circle cx="${x}" cy="${y - 192 * s}" r="${25 * s}" fill="${sk}"/>
  <path d="M${x - 25 * s} ${y - 196 * s} Q${x - 22 * s} ${y - 222 * s} ${x} ${y - 219 * s} Q${x + 24 * s} ${y - 222 * s} ${x + 25 * s} ${y - 194 * s} Q${x + 8 * s} ${y - 208 * s} ${x - 25 * s} ${y - 196 * s} Z" fill="${C.hair}"/>
  <circle cx="${x + 24 * s}" cy="${y - 206 * s}" r="${10 * s}" fill="${C.hair}"/>
  <circle cx="${x - 8 * s}" cy="${y - 192 * s}" r="${2.6 * s}" fill="${C.navy2}"/><circle cx="${x + 8 * s}" cy="${y - 192 * s}" r="${2.6 * s}" fill="${C.navy2}"/>
  ${mouth}</g>`;
}
function man(x, y, s, smile = true) {
  return `<g>
  <rect x="${x - 22 * s}" y="${y - 90 * s}" width="${44 * s}" height="${90 * s}" rx="${6 * s}" fill="#4A4F5C"/>
  <rect x="${x - 30 * s}" y="${y - 165 * s}" width="${60 * s}" height="${80 * s}" rx="${14 * s}" fill="#8FA3C7"/>
  <circle cx="${x}" cy="${y - 190 * s}" r="${24 * s}" fill="${C.skin2}"/>
  <ellipse cx="${x}" cy="${y - 206 * s}" rx="${42 * s}" ry="${8 * s}" fill="#E6D3A3"/>
  <path d="M${x - 20 * s} ${y - 208 * s} Q${x} ${y - 245 * s} ${x + 20 * s} ${y - 208 * s} Z" fill="#E6D3A3"/>
  <circle cx="${x - 8 * s}" cy="${y - 190 * s}" r="${2.6 * s}" fill="${C.navy2}"/><circle cx="${x + 8 * s}" cy="${y - 190 * s}" r="${2.6 * s}" fill="${C.navy2}"/>
  <path d="M${x - 9 * s} ${y - 179 * s} q ${9 * s} ${smile ? 8 : 2} ${18 * s} 0" stroke="${C.navy2}" stroke-width="${3 * s}" fill="none" stroke-linecap="round"/></g>`;
}
function card(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-90" y="-56" width="180" height="112" rx="16" fill="${C.navy}"/>
  <rect x="-90" y="-26" width="180" height="20" fill="${C.mag}"/><rect x="-66" y="10" width="38" height="28" rx="5" fill="${C.gold}"/>
  <rect x="10" y="22" width="56" height="8" rx="4" fill="#C9D4E6"/></g>`;
}
function atm(x, y) {
  return `<g><rect x="${x - 70}" y="${y - 250}" width="140" height="250" rx="14" fill="#5C6B8A"/><rect x="${x - 52}" y="${y - 228}" width="104" height="70" rx="8" fill="#BFE0F5"/>
  <rect x="${x - 40}" y="${y - 140}" width="80" height="10" rx="5" fill="${C.navy2}"/><g fill="#D6DFEC">${[0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${x - 36 + c * 26}" y="${y - 118 + r * 22}" width="20" height="14" rx="3"/>`).join("")).join("")}</g>
  <rect x="${x - 50}" y="${y - 40}" width="100" height="12" rx="6" fill="${C.navy2}"/></g>`;
}
function truck(x, y) {
  return `<g><rect x="${x - 150}" y="${y - 110}" width="190" height="80" rx="10" fill="#9DB2D6"/><path d="M${x + 40} ${y - 110} h60 l40 45 v35 h-100 Z" fill="${C.navy}"/>
  <rect x="${x + 52}" y="${y - 100}" width="40" height="30" rx="4" fill="#BFE0F5"/><circle cx="${x - 100}" cy="${y - 28}" r="26" fill="#2B2F3A"/><circle cx="${x + 90}" cy="${y - 28}" r="26" fill="#2B2F3A"/>
  <circle cx="${x - 100}" cy="${y - 28}" r="10" fill="#C9D4E6"/><circle cx="${x + 90}" cy="${y - 28}" r="10" fill="#C9D4E6"/></g>`;
}
function house(x, y) {
  return `<g><rect x="${x - 110}" y="${y - 150}" width="220" height="150" fill="#FFFFFF"/><path d="M${x - 130} ${y - 150} L${x} ${y - 240} L${x + 130} ${y - 150} Z" fill="${C.mag}" opacity=".85"/>
  <rect x="${x - 26}" y="${y - 90}" width="52" height="90" rx="4" fill="${C.navy}"/><rect x="${x + 46}" y="${y - 120}" width="44" height="40" rx="4" fill="#BFE0F5"/></g>`;
}
function back() {
  return `<rect width="1280" height="720" fill="${C.sky}"/><path d="M0 470 Q200 380 420 450 T860 430 T1280 440 V720 H0Z" fill="${C.hill}"/><rect y="560" width="1280" height="160" fill="${C.ground}"/>`;
}
function cross(x, y, s, o) {
  return `<g opacity="${o}" transform="translate(${x} ${y}) scale(${s})"><circle r="120" fill="${C.white}" opacity=".9"/><circle r="120" fill="none" stroke="${C.mag}" stroke-width="18"/>
  <path d="M-55 -55 L55 55 M55 -55 L-55 55" stroke="${C.mag}" stroke-width="26" stroke-linecap="round"/></g>`;
}
function tick(x, y, s, o) {
  return `<g opacity="${o}" transform="translate(${x} ${y}) scale(${s})"><circle r="110" fill="${C.navy}"/>
  <path d="M-50 2 L-14 40 L54 -38" stroke="${C.white}" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
const fade = (t, a, b) => cl((t - a) / .4) * (1 - cl((t - (b - .4)) / .4));
const coinSlots = (x0, y0, dx = 64, dy = 62) => Array.from({length: 10}, (_, i) => [x0 + (i % 5) * dx, y0 + Math.floor(i / 5) * dy]);

function render(t) {
  let g = "";
  // 0 · título
  if (t < 3.2) {
    const o = fade(t, -1, 3.2);
    g += `<g opacity="${o}"><rect width="1280" height="720" fill="${C.navy}"/><rect x="500" y="190" width="280" height="180" rx="28" fill="#FFFFFF" opacity=".14"/>${card(640, 280, 1.3 * pop(t, .2))}
    <text x="640" y="480" text-anchor="middle" font-family="'Bricolage Grotesque','Arial Black',Arial" font-weight="800" font-size="64" fill="#FFFFFF">Tu apoyo es tuyo, completo</text>
    <rect x="560" y="520" width="160" height="10" rx="5" fill="${C.pink}"/></g>`;
  }
  // 1 · el apoyo llega completo
  if (t >= 2.8 && t < 10.2) {
    const o = fade(t, 2.8, 10.2);
    let s = back() + house(250, 560) + woman(470, 600, 1.55, {});
    if (t > 3.8) s += card(900, 250, pop(t, 3.8));
    coinSlots(780, 400).forEach(([x, y], i) => { const a = 4.8 + i * .3; if (t > a) s += coin(x, lerp(y - 320, y, p(t, a, a + .45)), 24); });
    g += `<g opacity="${o}">${s}</g>`;
  }
  // 2 y 3 · alguien se queda con una parte
  if (t >= 9.8 && t < 23.2) {
    const o = fade(t, 9.8, 23.2);
    const tx = lerp(1450, 1130, p(t, 10, 11.6));
    let s = back() + atm(660, 600) + truck(tx, 600);
    s += woman(330, 610, 1.5, {sad: t > 16.2});
    if (t > 11.8) s += man(lerp(1060, 960, p(t, 11.8, 12.6)), 610, 1.45, true);
    const slots = coinSlots(420, 300, 44, 46);
    slots.forEach(([x, y], i) => {
      const a = 12.8 + i * .2; if (t <= a) return;
      let cx = lerp(660, x, p(t, a, a + .4)), cy = lerp(560, y, p(t, a, a + .4));
      if (i >= 5) { const b = 15 + (i - 5) * .25; cx = lerp(cx, 905 + (i - 5) * 8, p(t, b, b + .7)); cy = lerp(cy, 480 - (i - 5) * 8, p(t, b, b + .7)); }
      s += coin(cx, cy, 18);
    });
    if (t > 19) s += `<rect width="1280" height="720" fill="#FFFFFF" opacity="${.45 * p(t, 19, 19.4)}"/>` + cross(935, 440, pop(t, 19.3), 1);
    g += `<g opacity="${o}">${s}</g>`;
  }
  // 4 · en grupo, solo el pasaje
  if (t >= 22.8 && t < 33.2) {
    const o = fade(t, 22.8, 33.2);
    let s = back() + truck(830, 600);
    const xs = [170, 300, 430, 560];
    const looks = [{rebozo: C.navy}, {rebozo: C.mag, skirt: "#3E5A8C"}, {rebozo: "#5A3E8C", skin: C.skin2}, {rebozo: C.navy2, skirt: "#6F5B9C"}];
    xs.forEach((x, i) => s += woman(x, 610, 1.25, looks[i]));
    s += `<rect x="1040" y="470" width="110" height="130" rx="22" fill="#FFFFFF" opacity=".55" stroke="${C.navy}" stroke-width="6"/><rect x="1060" y="455" width="70" height="20" rx="6" fill="${C.navy}"/>`;
    xs.forEach((x, i) => {
      const a = 24.6 + i * 1.7; if (t <= a) return;
      const k = p(t, a, a + 1.1), cx = lerp(x + 30, 1095 - 18 + i * 12, k), cy = lerp(470, 580 - (k > .99 ? i * 4 : 0), k) - Math.sin(k * Math.PI) * 120;
      s += coin(cx, cy, 11);
    });
    g += `<g opacity="${o}">${s}</g>`;
  }
  // 5 · cobra ella misma, completo
  if (t >= 32.8 && t < 40.2) {
    const o = fade(t, 32.8, 40.2);
    let s = back() + woman(230, 600, 1.05, {rebozo: C.mag, skirt: "#3E5A8C"}) + woman(320, 600, 1.05, {rebozo: "#5A3E8C", skin: C.skin2}) + woman(140, 600, 1.05, {rebozo: C.navy2, skirt: "#6F5B9C"});
    s += atm(800, 600) + woman(560, 615, 1.55, {bag: true});
    coinSlots(620, 470, 30, 30).forEach(([x, y], i) => {
      const a = 34 + i * .15; if (t <= a) return;
      let cx = lerp(800, x + 40, p(t, a, a + .35)), cy = lerp(560, y, p(t, a, a + .35));
      const b = 36.4 + i * .12; cx = lerp(cx, 632, p(t, b, b + .5)); cy = lerp(cy, 455, p(t, b, b + .5));
      if (t < b + .5) s += coin(cx, cy, 15);
    });
    if (t > 37.8) s += coin(633, 432, 14, p(t, 37.8, 38.2));
    g += `<g opacity="${o}">${s}</g>`;
  }
  // 6 · así sí
  if (t >= 39.8) {
    const o = cl((t - 39.8) / .4);
    let s = back() + tick(640, 190, pop(t, 40.2), 1) + card(330, 450, 1.1);
    coinSlots(490, 410, 62, 60).forEach(([x, y]) => s += coin(x, y, 24));
    s += woman(900, 640, 1.05, {rebozo: C.mag, skirt: "#3E5A8C"}) + woman(1000, 640, 1.2, {bag: true}) + woman(1100, 640, 1.05, {rebozo: "#5A3E8C", skin: C.skin2}) + woman(1190, 640, 1.05, {rebozo: C.navy2, skirt: "#6F5B9C"});
    g += `<g opacity="${o}">${s}</g>`;
  }
  document.getElementById("v").innerHTML = g;
}
window.render = render; window.DUR = DUR;
if (!location.hash.includes("captura")) { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }
</script></body></html>
