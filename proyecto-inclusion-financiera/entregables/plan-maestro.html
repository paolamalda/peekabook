<script id="data" type="application/json">{"actualizado":"2026-09-28","diferenciadores":[{"id":"D01","grupo":"Contenido","titulo":"Hecho para migrantes, no adaptado","detalle":"Cada lección considera SSN, ITIN, matrícula consular o ningún documento. Nadie queda fuera por su situación documental.","como":"Filtro de documentos en lecciones, matriz y app."},{"id":"D02","grupo":"Contenido","titulo":"Remesas como decisión financiera completa","detalle":"Capacidad de envío por fecha, costo total real, acuerdo familiar, emergencias y deuda por enviar. Ningún curso gratuito lo integra así.","como":"Módulo 2 completo + calculadora de remesa real."},{"id":"D03","grupo":"Contenido","titulo":"Visión binacional","detalle":"Metas en pesos, AFORE e IMSS frente a Social Security, bienes en México, retorno y patrimonio entre dos países.","como":"Unidades M2 U11, M5 U06 y metas binacionales en la app."},{"id":"D04","grupo":"Contenido","titulo":"Fraudes que sí afectan a migrantes","detalle":"Notarios y falsos abogados, llamadas que se hacen pasar por ICE, IRS o USCIS, falsos empleos y emergencias familiares falsas.","como":"Unidad nueva M4 U10 + herramienta ¿Es estafa?"},{"id":"D05","grupo":"Contenido","titulo":"Casos reales y fechados","detalle":"Casos públicos de la FTC y el CFPB, observaciones de mercado con fecha y, con consentimiento, historias de participantes.","como":"Banco de casos con fuente, fecha y permiso."},{"id":"D06","grupo":"Contenido","titulo":"Sin culpa","detalle":"No culpa a la persona por su situación. Distingue hábitos de problemas estructurales como la renta o la pérdida de horas.","como":"Guía de tono y revisión editorial."},{"id":"D07","grupo":"Contenido","titulo":"Autonomía económica de las mujeres","detalle":"Abuso económico, control de documentos y decisiones compartidas, siempre con rutas seguras y sin pedir que nadie revele su historia.","como":"M4 U04 y actividades con casos ficticios."},{"id":"D08","grupo":"Contenido","titulo":"Contenido por estado","detalle":"Núcleo federal (~70%) y ficha estatal (~30%): California primero, luego Texas, Illinois, Nueva York y Florida.","como":"Plantilla estatal en el manual del operador."},{"id":"D09","grupo":"Información","titulo":"Matriz comparativa viva e independiente","detalle":"Productos, instituciones, comisiones y requisitos con fecha de verificación visible y costo según el uso real de cada persona.","como":"Base de datos con metodología pública; nadie paga por aparecer arriba."},{"id":"D10","grupo":"Información","titulo":"Directorio de ayuda verificado","detalle":"Ayuda fiscal, legal, de vivienda y comunitaria con costo, idioma, credencial y alcance confirmados.","como":"Fichas con fecha de revisión y guion para pedir información."},{"id":"D11","grupo":"Información","titulo":"Actualización programada","detalle":"Revisión mensual de la matriz y revisión antes de cada temporada fiscal. Una ficha vencida se marca como pendiente.","como":"Calendario editorial y responsable por ficha."},{"id":"D12","grupo":"Aprendizaje","titulo":"Lectura en tres capas","detalle":"Lo esencial en 3 minutos, Profundiza y Fuentes. Completo sin ser extenso.","como":"Estructura fija de cada lección."},{"id":"D13","grupo":"Aprendizaje","titulo":"Aprender haciendo","detalle":"Misiones que premian acciones reales (revisar mi reporte, comparar 3 remesadoras), nunca compras ni contrataciones.","como":"Gamificación con puntos y niveles ligada a evidencias."},{"id":"D14","grupo":"Aprendizaje","titulo":"Historia en serie","detalle":"Alex y Mar acompañan todos los cursos como una serie con temporadas. Invita a continuar al siguiente curso.","como":"Guion narrativo que cruza módulos y cursos."},{"id":"D15","grupo":"Aprendizaje","titulo":"Interactivos y juegos","detalle":"Escenarios ramificados, arrastrar y clasificar, simuladores, '¿estafa o no?' y retos cronometrados.","como":"H5P dentro de Moodle."},{"id":"D16","grupo":"Experiencia","titulo":"Primero el celular","detalle":"Microlecciones de 5 a 7 minutos, bajo consumo de datos, modo sin conexión y modo audio.","como":"Diseño móvil, app de Moodle y audios cortos."},{"id":"D17","grupo":"Experiencia","titulo":"Acompañamiento por WhatsApp","detalle":"Recordatorios, microretos y avisos de fraudes nuevos en el canal que más usa la comunidad.","como":"WhatsApp Business API con permiso explícito."},{"id":"D18","grupo":"Experiencia","titulo":"Idiomas y lenguas indígenas","detalle":"Español e inglés separados y, en una fase posterior, audio en mixteco, zapoteco y otras lenguas.","como":"Aliados comunitarios como MICOP."},{"id":"D19","grupo":"Experiencia","titulo":"Personas reales que responden","detalle":"Dudas atendidas, sesión mensual en vivo y derivación a ayuda profesional cuando el caso lo requiere.","como":"Mesa de ayuda con tiempos publicados."},{"id":"D20","grupo":"Experiencia","titulo":"App que acompaña, no solo alcancía","detalle":"Calendario de dinero, remesa real, metas binacionales, ruta de crédito y carpeta de continuidad.","como":"App de complementos (ver lista de complementos)."},{"id":"D21","grupo":"Confianza","titulo":"Constancia verificable","detalle":"Insignia digital con enlace verificable que se puede compartir en LinkedIn o con un empleador.","como":"Open Badges desde Moodle."},{"id":"D22","grupo":"Confianza","titulo":"Privacidad desde el diseño","detalle":"No pedimos SSN, ITIN, estatus migratorio ni contraseñas. Datos mínimos y la persona decide qué comparte.","como":"Política de privacidad y diseño local primero."},{"id":"D23","grupo":"Confianza","titulo":"Gratis de verdad","detalle":"Sin compra, sin referidos y sin reseña obligatoria para aprender o recibir la constancia.","como":"Regla escrita en términos y en el manual."},{"id":"D24","grupo":"Confianza","titulo":"Consejo asesor y revisión profesional","detalle":"Contenido revisado por especialistas fiscales, legales, financieros y comunitarios.","como":"Registro de revisión por lección."},{"id":"D25","grupo":"Confianza","titulo":"Impacto medido con estándares nacionales","detalle":"Escala de bienestar financiero del CFPB y medidas comparables con encuestas de la FDIC y FINRA.","como":"Evaluación antes y después, e informe anual público."}],"complementos":[{"id":"C01","fase":"MVP","titulo":"Mi calendario de dinero","valor":"Muestra el saldo día por día según las fechas reales de cobro y pago, y avisa antes de una semana en negativo.","curso":"M1 U04, U07, U08","nota":"Funciona con datos que la persona escribe; no requiere conectar el banco."},{"id":"C02","fase":"MVP","titulo":"Remesa real","valor":"Calcula cuánto llega de verdad (comisión, tipo de cambio, impuesto aplicable, costo de cobro) y compara con un tipo de cambio de referencia.","curso":"M2 U06, U07","nota":"Usa cotizaciones con fecha. No envía dinero."},{"id":"C03","fase":"MVP","titulo":"Metas con propósito","valor":"Metas en dólares o pesos, con fecha, aportación posible y escenario de tipo de cambio. Evita contar el mismo dinero dos veces.","curso":"M5 U01, U09; M2 U11","nota":"Registro de metas; no guarda dinero."},{"id":"C04","fase":"MVP","titulo":"¿Es estafa?","valor":"Preguntas guiadas ante un mensaje o llamada sospechosa, qué hacer ahora y dónde reportar.","curso":"M4 U01, U03, U10","nota":"Alertas de fraudes actuales revisadas por el equipo."},{"id":"C05","fase":"MVP","titulo":"Acuerdo familiar de remesas","valor":"Propósito, rango, fecha, qué hacer en una emergencia y cómo verificar. Se puede compartir con la familia.","curso":"M2 U05, U10","nota":"Sin datos bancarios del receptor."},{"id":"C06","fase":"Fase 2","titulo":"Ruta de crédito","valor":"Diagnóstico según la situación (sin historial, error, atraso), recordatorios de pago y de revisión del reporte, y simulador de deudas.","curso":"M3 completo","nota":"No consulta el buró ni promete puntos."},{"id":"C07","fase":"Fase 2","titulo":"Tandas y círculos","valor":"Registro de turnos y aportaciones de una tanda, y enlace a círculos de préstamo que sí reportan a buró.","curso":"M3 U10 (nueva)","nota":"Solo registra; nunca recibe ni mueve dinero."},{"id":"C08","fase":"Fase 2","titulo":"Carpeta de continuidad","valor":"Índice de documentos, contactos y plan de preparación familiar, cifrado en el propio teléfono.","curso":"M4 U08, U11 (nueva); M5 U07","nota":"Cifrado en el dispositivo; el equipo no puede leerlo."},{"id":"C09","fase":"Fase 2","titulo":"Calendario fiscal","valor":"Lista de documentos, fechas, localizador de ayuda gratuita (VITA) y verificación de créditos con ITIN.","curso":"M1 U09, U10, U13 (nueva)","nota":"Orienta; no prepara declaraciones."},{"id":"C10","fase":"Fase 2","titulo":"Mapa de ayuda","valor":"Consulados, cooperativas, VITA, ayuda legal certificada y cuentas Bank On, con filtros por idioma y costo.","curso":"Directorio del manual","nota":"Fichas con fecha de verificación."},{"id":"C11","fase":"Fase 3","titulo":"Tutor en español","valor":"Explica conceptos del curso con ejemplos y dirige a la lección correcta.","curso":"Todos","nota":"Limitado al contenido del curso; no da asesoría legal, fiscal, migratoria ni de inversión."},{"id":"C12","fase":"Fase 3","titulo":"Termómetro de bienestar","valor":"Escala oficial del CFPB al inicio y cada 90 días. La persona ve su avance; el programa mide impacto agregado.","curso":"Seguimiento","nota":"Opcional y anónimo en los reportes."},{"id":"C13","fase":"Fase 3","titulo":"Comparador de cuentas para mi uso","valor":"Dice cuánto costaría cada cuenta según cómo cobra y deposita la persona (efectivo, nómina, cajeros).","curso":"M2 U02, U03","nota":"Alimentado por la matriz viva."}],"competencia":[{"nombre":"FDIC Money Smart","tipo":"Currículo público","ofrece":"Módulos para adultos, jóvenes y pequeñas empresas; en español.","costo":"Gratis (dominio público)","brecha":"Genérico: no cubre remesas a fondo, ni documentación, ni comparativa de productos.","uso":"Referencia y material complementario."},{"nombre":"CFPB Your Money, Your Goals y consumerfinance.gov en español","tipo":"Herramientas públicas","ofrece":"Herramientas de presupuesto, deuda y metas; guías en español.","costo":"Gratis","brecha":"Pensado para facilitadores; sin plataforma, seguimiento ni gamificación.","uso":"Referencia; formularios de apoyo."},{"nombre":"Wells Fargo Hands on Banking","tipo":"Curso de banco","ofrece":"Cursos en línea de finanzas personales, también en español.","costo":"Gratis","brecha":"Contenido de una marca bancaria; no compara con otras opciones.","uso":"Conocer formato; no citar como neutral."},{"nombre":"Bank of America Better Money Habits","tipo":"Contenido de banco","ofrece":"Videos y artículos breves, algunos en español.","costo":"Gratis","brecha":"Sin ruta de aprendizaje, sin evaluación ni constancia.","uso":"Referencia de formato corto."},{"nombre":"Visa Practical Money Skills","tipo":"Contenido de marca","ofrece":"Juegos y lecciones, incluye español.","costo":"Gratis","brecha":"Juegos genéricos; sin temas migrantes.","uso":"Ideas de juegos."},{"nombre":"Khan Academy (finanzas personales)","tipo":"Plataforma educativa","ofrece":"Videos y ejercicios.","costo":"Gratis","brecha":"Mayormente en inglés y para estudiantes; no aborda la vida migrante.","uso":"Referencia pedagógica."},{"nombre":"Next Gen Personal Finance (NGPF)","tipo":"Currículo escolar","ofrece":"Currículo completo con juegos para preparatoria.","costo":"Gratis","brecha":"Para escuelas y jóvenes, no para adultos migrantes.","uso":"Ideas de actividades y juegos."},{"nombre":"Zogo","tipo":"App gamificada","ofrece":"Microlecciones con recompensas, distribuida por cooperativas y bancos.","costo":"Gratis para el usuario","brecha":"Genérica y en inglés; sin remesas ni documentación.","uso":"Referencia de gamificación; posible modelo de distribución vía cooperativas."},{"nombre":"Operation HOPE","tipo":"Organización sin fines de lucro","ofrece":"Coaching financiero y educación en comunidades.","costo":"Gratis","brecha":"Presencial y por sede; no enfocado en migrantes.","uso":"Posible aliado o referencia."},{"no <script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const groups = a => [...new Set(a)];

// Pestañas
const tabs = document.querySelectorAll('nav button');
function show(t){
  tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['dif','com','cmp','todo'].forEach(k => document.getElementById('p-'+k).hidden = k !== t);
  try { localStorage.setItem('tab', t); } catch(e) {}
}
tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
const hashTab = location.hash.replace('#','');
let saved = null; try { saved = localStorage.getItem('tab'); } catch(e) {}
show(['dif','com','cmp','todo'].includes(hashTab) ? hashTab : (saved || 'dif'));

// Diferenciadores
(function(){
  const el = document.getElementById('p-dif');
  el.innerHTML = '<div class="tools"><input id="q-dif" type="search" placeholder="Buscar diferenciador" aria-label="Buscar diferenciador"></div><div id="dif-list"></div>';
  const render = q => {
    const f = D.diferenciadores.filter(d => (d.titulo+d.detalle+d.como+d.grupo).toLowerCase().includes(q));
    document.getElementById('dif-list').innerHTML = groups(f.map(d => d.grupo)).map(g =>
      '<h2>'+esc(g)+'</h2><div class="grid">' + f.filter(d => d.grupo === g).map(d =>
        '<article class="card"><div class="meta"><span class="chip">'+d.id+'</span></div><h3>'+esc(d.titulo)+'</h3><p>'+esc(d.detalle)+'</p><div class="how"><strong>Cómo:</strong> '+esc(d.como)+'</div></article>').join('') + '</div>').join('') || '<p class="note">Sin resultados.</p>';
  };
  render('');
  document.getElementById('q-dif').addEventListener('input', e => render(e.target.value.toLowerCase()));
})();

// Complementos
(function(){
  const el = document.getElementById('p-com');
  el.innerHTML = groups(D.complementos.map(c => c.fase)).map(f =>
    '<h2>'+esc(f)+'</h2><div class="grid">' + D.complementos.filter(c => c.fase === f).map(c =>
      '<article class="card"><div class="meta"><span class="chip">'+c.id+'</span><span class="chip acc">'+esc(c.fase)+'</span></div><h3>'+esc(c.titulo)+'</h3><p>'+esc(c.valor)+'</p><div class="how"><strong>Lecciones:</strong> '+esc(c.curso)+'<br><strong>Nota:</strong> '+esc(c.nota)+'</div></article>').join('') + '</div>').join('');
})();

// Competencia
(function(){
  const el = document.getElementById('p-cmp');
  el.innerHTML = '<div class="tools"><input id="q-cmp" type="search" placeholder="Buscar por nombre o tipo" aria-label="Buscar competencia"></div><div class="tbl"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Qué ofrece</th><th>Costo</th><th>Brecha frente a nosotros</th><th>Cómo lo usamos</th></tr></thead><tbody id="cmp-body"></tbody></table></div>';
  const render = q => {
    document.getElementById('cmp-body').innerHTML = D.competencia.filter(c => (c.nombre+c.tipo+c.ofrece).toLowerCase().includes(q)).map(c =>
      '<tr><td>'+esc(c.nombre)+'</td><td>'+esc(c.tipo)+'</td><td>'+esc(c.ofrece)+'</td><td>'+esc(c.costo)+'</td><td>'+esc(c.brecha)+'</td><td>'+esc(c.uso)+'</td></tr>').join('');
  };
  render('');
  document.getElementById('q-cmp').addEventListener('input', e => render(e.target.value.toLowerCase()));
})();

// Pendientes con estado compartido
const state = {};
let db = null, canWrite = true;
const LABEL = {pendiente:'Pendiente', en_curso:'En curso', hecho:'Hecho'};
function renderTodo(){
  const el = document.getElementById('p-todo');
  const filter = (document.getElementById('f-todo') || {}).value || 'todos';
  const n = D.todo.length;
  const c = {pendiente:0,en_curso:0,hecho:0};
  D.todo.forEach(t => c[state[t.id] || 'pendiente']++);
  const pct = k => (100*c[k]/n).toFixed(1)+'%';
  const head = '<div class="progress"><strong>'+c.hecho+' de '+n+' hechos</strong><div class="bar" aria-hidden="true"><span style="width:'+pct('hecho')+';background:var(--done)"></span><span style="width:'+pct('en_curso')+';background:var(--doing)"></span></div><span class="chip">En curso: '+c.en_curso+'</span><span class="chip">Pendientes: '+c.pendiente+'</span></div>'
   + '<div class="tools"><label for="f-todo">Mostrar</label><select id="f-todo"><option value="todos">Todos</option><option value="pendiente">Pendientes</option><option value="en_curso">En curso</option><option value="hecho">Hechos</option></select></div>'
   + (db ? '' : '<p class="note">El estado compartido no está disponible en esta vista; los cambios no se guardarán.</p>')
   + (db && !canWrite ? '<p class="note">Tienes acceso de lectura; pide acceso de colaborador para cambiar estados.</p>' : '');
  const body = groups(D.todo.map(t => t.cat)).map(cat => {
    const items = D.todo.filter(t => t.cat === cat && (filter === 'todos' || (state[t.id] || 'pendiente') === filter));
    if (!items.length) return '';
    return '<div class="todo-cat"><h3>'+esc(cat)+'</h3>' + items.map(t => {
      const s = state[t.id] || 'pendiente';
      return '<div class="item'+(s==='hecho'?' done':'')+'"><span class="id">'+t.id+'</span><div class="txt">'+esc(t.tarea)+'<small>Responsable: '+esc(t.resp)+'</small></div>'
        + '<select id="s-'+t.id+'" class="s-'+s+'" data-id="'+t.id+'" aria-label="Estado de '+t.id+'"'+(db && canWrite ? '' : ' disabled')+'>'
        + Object.keys(LABEL).map(k => '<option value="'+k+'"'+(k===s?' selected':'')+'>'+LABEL[k]+'</option>').join('') + '</select></div>';
    }).join('') + '</div>';
  }).join('');
  el.innerHTML = head + body;
  document.getElementById('f-todo').value = filter;
  document.getElementById('f-todo').addEventListener('change', renderTodo);
  el.querySelectorAll('select[data-id]').forEach(sel => sel.addEventListener('change', async e => {
    const id = e.target.dataset.id, v = e.target.value, prev = state[id] || 'pendiente';
    state[id] = v; renderTodo();
    try { await db.doc('estado/'+id).set({ s: v, t: new Date().toISOString() }); }
    catch(err){ state[id] = prev; if (err && err.code === 'invalid_argument') canWrite = false; renderTodo(); }
  }));
}
renderTodo();
(async () => {
  try {
    db = await window.claude?.use?.('db');
    if (!db) { renderTodo(); return; }
    const user = await window.claude.use('user');
    if (user && user.can) { const w = await user.can('data.write'); if (w === false) canWrite = false; }
    db.collection('estado').onSnapshot(snap => {
      snap.docs.forEach(d => { const v = d.data(); if (v && v.s) state[d.id] = v.s; });
      renderTodo();
    }, () => { db = null; renderTodo(); });
    renderTodo();
  } catch(e) { db = null; renderTodo(); }
})();
</script>
